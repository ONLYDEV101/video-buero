name: Kommentare
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: kommentare
jobs:
  kommentare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_BUSINESS_ID: "1910359486633208"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/kommentare.py antworten holen
          git config user.name "video-buero-bot"; git config user.email "actions@users.noreply.github.com"
          git add kommentare/
          if ! git diff --cached --quiet; then git commit -qm "Kommentare aktualisiert"; git pull --rebase -q && git push -q; fi
