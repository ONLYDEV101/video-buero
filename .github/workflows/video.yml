name: Video bauen

on:
  push:
    paths: ["episoden/*.json"]          # einzelne Test-Episoden (nur bauen)
  schedule:
    - cron: "17 */3 * * *"              # alle 3 Stunden: nächste Folge aus der Warteschlange
  workflow_dispatch:
    inputs:
      episode:
        description: "Pfad zur Episode (leer = nächste aus der Warteschlange)"
        required: false
      posten:
        description: "Auf Instagram posten?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Episode bestimmen
        id: ep
        run: |
          MODUS=bauen
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            LISTE="${{ github.event.inputs.episode }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            LISTE=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'episoden/*.json' | tr '\n' ' ')
          else
            LISTE=$(ls episoden/warteschlange/*.json 2>/dev/null | sort | head -1)
            MODUS=warteschlange
          fi
          if [ "$MODUS" = "warteschlange" ] && [ -z "$IG_TOKEN" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Noch kein IG_TOKEN – Zeitplan pausiert."; LISTE=""
          fi
          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          echo "modus=$MODUS" >> "$GITHUB_OUTPUT"
          echo "Episoden: ${LISTE:-keine}"

      - uses: actions/setup-python@v5
        if: steps.ep.outputs.liste != ''
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        if: steps.ep.outputs.liste != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          pip install -q piper-tts kokoro-onnx soundfile

      - uses: actions/cache@v4
        if: steps.ep.outputs.liste != ''
        with:
          path: voices
          key: stimmen-v2

      - name: Stimmen laden (Kokoro + Piper, kostenlos)
        if: steps.ep.outputs.liste != ''
        run: |
          mkdir -p voices
          KO=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s voices/kokoro.onnx ] || curl -sfL -o voices/kokoro.onnx $KO/kokoro-v1.0.onnx
          [ -s voices/kokoro-voices.bin ] || curl -sfL -o voices/kokoro-voices.bin $KO/voices-v1.0.bin
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main
          [ -s voices/en.onnx ] && { ls -la voices; exit 0; }
          curl -sfL -o voices/de.onnx      $HF/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx
          curl -sfL -o voices/de.onnx.json $HF/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json
          curl -sfL -o voices/en.onnx      $HF/en/en_US/ryan/high/en_US-ryan-high.onnx
          curl -sfL -o voices/en.onnx.json $HF/en/en_US/ryan/high/en_US-ryan-high.onnx.json
          ls -la voices

      - name: Video bauen
        if: steps.ep.outputs.liste != ''
        run: python scripts/render.py ${{ steps.ep.outputs.liste }}

      - uses: actions/upload-artifact@v4
        if: steps.ep.outputs.liste != ''
        with:
          name: videos
          path: out/
          retention-days: 14

      - name: Auf Instagram posten
        id: post
        if: steps.ep.outputs.liste != '' && env.IG_TOKEN != '' && (steps.ep.outputs.modus == 'warteschlange' || vars.AUTO_POST == 'true' || github.event.inputs.posten == 'true')
        run: python scripts/post_instagram.py out/*.mp4

      - name: Folge als gepostet ablegen
        if: steps.post.outcome == 'success' && steps.ep.outputs.modus == 'warteschlange'
        run: |
          mkdir -p episoden/gepostet
          git mv ${{ steps.ep.outputs.liste }} episoden/gepostet/
          git config user.name "video-buero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Gepostet: $(basename ${{ steps.ep.outputs.liste }})"
          git push
