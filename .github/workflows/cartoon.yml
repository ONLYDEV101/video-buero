name: Cartoon bauen

on:
  push:
    paths: ["cartoon/folgen/*.json"]
  workflow_dispatch:
    inputs:
      folgen:
        description: "Folgen (leer = alle in cartoon/folgen)"
        required: false

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "/tmp/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          pip install -q --timeout 60 piper-tts
          cd cartoon && npm install --no-audit --no-fund --silent
      - uses: actions/cache@v4
        with:
          path: voices
          key: stimmen-de-v1
      - name: Deutsche Stimmen laden (Piper, kostenlos)
        run: |
          mkdir -p voices; HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE
          lade() { [ -s voices/$1.onnx ] || { curl -sfL -o voices/$1.onnx $HF/$2.onnx && curl -sfL -o voices/$1.onnx.json $HF/$2.onnx.json; }; }
          lade de_thorsten_emotional thorsten_emotional/medium/de_DE-thorsten_emotional-medium
          lade de_kerstin kerstin/low/de_DE-kerstin-low
          lade de_karlsson karlsson/low/de_DE-karlsson-low
          lade de_thorsten thorsten/high/de_DE-thorsten-high
          ls -la voices
      - name: Folgen rendern
        run: |
          mkdir -p out
          LISTE="${{ github.event.inputs.folgen }}"; [ -n "$LISTE" ] || LISTE=$(ls cartoon/folgen/*.json)
          for f in $LISTE; do
            id=$(basename $f .json)
            python cartoon/tts.py $f build/$id
            node cartoon/render.js build/$id out/$id.mp4
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cartoons
          path: out/
          retention-days: 14
