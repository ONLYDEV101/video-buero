name: Doku bauen
on:
  schedule:
    - cron: "0 14 */2 * *"   # jeden 2. Tag 14:00 UTC (US-Morgen): nächste Doku aus der Warteschlange
  workflow_dispatch:
    inputs:
      datei:
        description: "Doku-JSON (z. B. dokus/warteschlange/doku_wirecard_en.json)"
        required: false
      posten:
        description: "Auf YouTube hochladen?"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: doku
  cancel-in-progress: false
jobs:
  doku:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "/tmp/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          (timeout 90 sudo apt-get install -y -qq fonts-dejavu-core || true)
          pip install -q edge-tts==7.3.1
      - name: Auswahl
        id: wahl
        run: |
          D="${{ github.event.inputs.datei }}"
          [ -z "$D" ] && D=$(ls dokus/warteschlange/*.json 2>/dev/null | sort | head -1)
          if [ -z "$D" ]; then echo "Warteschlange leer – nichts zu tun."; echo "datei=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Doku: $D"; echo "datei=$D" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.posten }}" = "true" ]; then echo "posten=true" >> "$GITHUB_OUTPUT"; fi
      - name: Doku bauen
        if: steps.wahl.outputs.datei != ''
        run: python scripts/doku.py "${{ steps.wahl.outputs.datei }}"
      - uses: actions/upload-artifact@v4
        if: steps.wahl.outputs.datei != ''
        with:
          name: doku
          path: out/
          retention-days: 14
      - name: YouTube
        id: yt
        if: steps.wahl.outputs.posten == 'true' && env.YT_REFRESH_TOKEN != ''
        run: python scripts/post_youtube.py out/*.mp4
      - name: Als gepostet markieren
        if: steps.yt.outcome == 'success'
        run: |
          git config user.name "video-buero-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p dokus/gepostet
          git mv "${{ steps.wahl.outputs.datei }}" dokus/gepostet/
          git commit -m "Doku gepostet: ${{ steps.wahl.outputs.datei }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
